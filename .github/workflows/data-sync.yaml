name: Notion Webhook Sync to Posts

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:


jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 코드 가져오기
        uses: actions/checkout@v4

      - name: 2. Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 3. 의존성 설치
        run: npm ci

      - name: 노션 동기화 스크립트 실행
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: npx tsx notion-sync.ts

      - name: 변경 사항 커밋 및 푸시
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add _posts/
          git diff --quiet && git diff --staged --quiet || (git commit -m "feat: 노션 웹훅 트리거 포스트 자동 업데이트" && git push)