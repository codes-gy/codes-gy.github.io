
# 블로그 색상 테마
minimal_mistakes_skin    : "default" # "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise", "catppuccin_latte", "catppuccin_mocha"

# ==============================================================================
# 사이트 기본 정보
# ==============================================================================

# 사이트 언어 설정 (기본값: "en-US" -> 한국어 설정시 UI가 한글화됨)
locale                   : "ko-KR"
# 글자 읽는 방향
direction                : "ltr"
# 브라우저 탭 및 메인 타이틀(기본값: 없음)
title                    : "Dev Blog"
# 페이지 제목과 사이트 제목 사이의 구분자
title_separator          : "-"
# 타이틀 부제목
subtitle                 : "생각, 일상, 개발 프로젝트 기록"
# 사이트 소유자 이름
name                     : "Ji Geun Yeong"
# SEO 및 검색 결과 설명 문구
description              : "Node.js, Java 백엔드 개발자"
# 도메인 URL
url                      : "https://codes-gy.github.io"
baseurl                  : # 하위 경로 설정 시 사용
# GitHub 저장소 경로
repository               : "codes-gy/codes-gy.github.io"
# SNS 공유 시 나타날 기본 섬네일 경로
teaser                   : # path of fallback teaser image, e.g. "/assets/images/500x300.png"
# 상단 네비게이션 헤더 로고 이미지 경로
logo                     : # path of logo image to display in the masthead, e.g. "/assets/images/88x88.png"
# 상단 헤더 타이틀
masthead_title           : # overrides the website title displayed in the masthead, use " " for no title
# 상단에 경로(Home > Category > Post) 표시 여부
breadcrumbs              : true
# 읽는 시간 계산용 분당 단어 수
words_per_minute         : 200
# 코드 블록 우측 상단 복사 버튼 활성화(기본값 비활성화)
enable_copy_code_button  : true
# 저작권 표기 이름
copyright                : # "copyright" name, defaults to site.title
# 저작권 연결 URL
copyright_url            : # "copyright" URL, defaults to site.url

# ==============================================================================
# 댓글
# ==============================================================================

comments:
  # 댓글 플랫폼 사용여부
  # false (default), "disqus", "discourse", "facebook", "staticman", "staticman_v2", "utterances", "giscus", "custom"
  provider               : false
  disqus:
    # Disqus Shortname
    shortname            : # https://help.disqus.com/customer/portal/articles/466208-what-s-a-shortname-
  discourse:
    server               : # https://meta.discourse.org/t/embedding-discourse-comments-via-javascript/31963 , e.g.: meta.discourse.org
  facebook:
    # https://developers.facebook.com/docs/plugins/comments
    appid                :
    num_posts            : # 5 (default)
    colorscheme          : # "light" (default), "dark"
  utterances:
    # "github-light" (default), "github-dark"
    theme                : "github-dark"
    # "pathname" (default)
    issue_term           : "pathname"
  giscus:
    repo_id              : # Shown during giscus setup at https://giscus.app
    category_name        : # Full text name of the category
    category_id          : # Shown during giscus setup at https://giscus.app
    discussion_term      : # "pathname" (default), "url", "title", "og:title"
    reactions_enabled    : # '1' for enabled (default), '0' for disabled
    theme                : # "light" (default), "dark", "dark_dimmed", "transparent_dark", "preferred_color_scheme"
    strict               : # 1 for enabled, 0 for disabled (default)
    input_position       : # "top", "bottom" # The comment input box will be placed above or below the comments
    emit_metadata        : # 1 for enabled, 0 for disabled (default) # https://github.com/giscus/giscus/blob/main/ADVANCED-USAGE.md#imetadatamessage
    lang                 : # "en" (default)
    lazy                 : # true, false # Loading of the comments will be deferred until the user scrolls near the comments container.
  staticman:
    branch               : # "master"
    endpoint             : # "https://{your Staticman v3 API}/v3/entry/github/"
reCaptcha:
  siteKey                :
  secret                 :
atom_feed:
  path                   : # blank (default) uses feed.xml
  hide                   : # true, false (default)

# ==============================================================================
# 검색 기능
# ==============================================================================

# true, false (default)
search                   : true
# true, false (default)
search_full_content      : true
# lunr (default), algolia, google
search_provider          : lunr
lunr:
  # true, false (default)
  search_within_pages    : true
algolia:
  application_id         : # YOUR_APPLICATION_ID
  index_name             : # YOUR_INDEX_NAME
  search_only_api_key    : # YOUR_SEARCH_ONLY_API_KEY
  powered_by             : # true (default), false
google:
  search_engine_id       : # YOUR_SEARCH_ENGINE_ID
  instant_search         : # false (default), true

# ==============================================================================
# SEO
# ==============================================================================
google_site_verification :
bing_site_verification   :
naver_site_verification  :
yandex_site_verification :
baidu_site_verification  :

# ==============================================================================
# 소셜 기능
# ==============================================================================
twitter:
  username               :
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 : # Open Graph/Twitter default site image
og_image_alt             : # Alt text for Open Graph/Twitter default site image
# For specifying social profiles
# - https://developers.google.com/structured-data/customize/social-profiles
social:
  type                   : # Person or Organization (defaults to Person)
  name                   : # If the user or organization name differs from the site's name
  links: # An array of links to social media profiles


analytics:
  provider               : # false (default), "google", "google-universal", "google-gtag", "custom"
  google:
    tracking_id          :
    anonymize_ip         : # true, false (default)


# ==============================================================================
# 프로필/작성자 정보
# ==============================================================================
author:
  name             : "Ji Geun Yeong"
  avatar           : "/assets/images/profile.jpg"
  bio              : "Node.js, Java 백엔드 개발자"
  location         : "South Korea"
  email            : "podojjang_kr@naver.com"
  # fediverse      : "@you@instance.social"  # used for fediverse:creator meta tag
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/codes-gy"

# ==============================================================================
# 하단 푸터
# ==============================================================================
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/codes-gy"

  # 사이트 시작 연도 표기
  since: "2026"


# ==============================================================================
# 빌드 포함/제외 파일 설정
# ==============================================================================

include:
  - .htaccess
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - minimal-mistakes-jekyll.gemspec
  - node_modules
  - package.json
  - package-lock.json
  - Rakefile
  - README
  - tmp
  - /docs # ignore Minimal Mistakes /docs
  - /test # ignore Minimal Mistakes /test
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# ==============================================================================
# 변환 엔진 및 마크다운 옵션
# ==============================================================================
markdown: kramdown
highlighter: rouge
lsi: false
# 요약글 분리 기준 문자
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# Sass/SCSS 스타일 설정
sass:
  sass_dir: _sass
  style: compressed # https://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style
  quiet_deps: true
  silence_deprecations: ['import']


# ==============================================================================
# URL 구조 및 시간대 설정
# ==============================================================================

# 글 주소 형식 (기본값: /:categories/:title/)
permalink: /:categories/:title/
# 시간대 설정 (기본값: 없음 -> UTC 기준)
timezone: "Asia/Seoul" # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones


# ==============================================================================
# 페이지네이션
# ==============================================================================

# 한 페이지에 보여줄 글 개수
paginate: 6
# 페이지네이션 URL 구조 (기본값: /page:num/
paginate_path: /page:num/

# Pagination with jekyll-paginate-v2
# See https://github.com/sverrirs/jekyll-paginate-v2/blob/master/README-GENERATOR.md#site-configuration
#   for configuration details
pagination:
  # 빌드할 때 터미널에 디버그 로그 출력 여부
  debug: false
  # 페이지네이션을 적용할 대상 컬렉션 지정
  collection: 'posts'
  # 한 페이지에 보여줄 포스트(글) 개수
  per_page: 10
  # 2페이지부터 적용될 URL 주소 구조
  permalink: '/page/:num/'
  # 페이지별 브라우저 탭 타이틀 예시
  title: ':title - page :num'
  # 생성할 최대 페이지 수 제한
  limit: 0
  # 글 정렬 기준 필드
  sort_field: 'date'
  # 정렬 순서 뒤집기 (true: 최신글이 가장 위에 오도록 내림차순 정렬)
  sort_reverse: true
  # 특정 카테고리의 글만 불러올 때 지정 (빈값 '' 설정 시 모든 카테고리 포함)
  category: ''
  # 특정 태그의 글만 불러올 때 지정 (빈값 '' 설정 시 모든 태그 포함)
  tag: ''
  # 다국어(i18n) 설정 시 특정 언어의 글만 필터링할 때 사용
  locale: ''
  trail:
    # 현재 페이지 '앞'으로 보여줄 페이지 번호 개수 (예: 현재가 3페이지면 1, 2 표시)
    before: 2
    # 현재 페이지 '뒤'로 보여줄 페이지 번호 개수 (예: 현재가 3페이지면 4, 5 표시)
    after: 2


# ==============================================================================
# 플러그인
# ==============================================================================
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

# mimic GitHub Pages with --safe
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache


# ==============================================================================
# 카테고리 & 태그 아카이브 경로 설정
# ==============================================================================

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
# show_taxonomy: false  # set to false to hide tag/category lists on posts
# https://github.com/jekyll/jekyll-archives
# jekyll-archives:
#   enabled:
#     - categories
#     - tags
#   layouts:
#     category: archive-taxonomy
#     tag: archive-taxonomy
#   permalinks:
#     category: /categories/:name/
#     tag: /tags/:name/


# HTML 압축 설정
compress_html:
  clippings: all
  ignore:
    envs: development


# ==============================================================================
# 문서 기본 설정값
# ==============================================================================

defaults:
  # _posts
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "single"
      author_profile: true
      read_time: false
      comments: # true
      share: false
      related: true
      date_format: "%Y-%m-%d"

